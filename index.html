<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freelance Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#26344A">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#26344A;--ink-soft:#4A5A70;
    --bg:#F1F3F5;--card:#FFFFFF;--border:#E1E5EA;
    --success:#2D9C7F;--success-bg:#E2F4EE;
    --danger:#C15B3D;--danger-bg:#FBEBE5;
    --gold:#C9972E;--gold-bg:#FBF1DD;
    --sub:#6B7688;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);margin:0;line-height:1.5;}
  .wrap{max-width:420px;margin:0 auto;padding:1.25rem 1.25rem 3rem;}
  header{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1.25rem;}
  .logo-img{height:50px;width:auto;border-radius:10px;display:block;}
  .lang-btn{min-width:42px;height:34px;border-radius:17px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;padding:0 10px;}
  .tabs{display:flex;gap:6px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:1.25rem;border:1px solid var(--border);}
  .tab-btn{flex:1;text-align:center;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--sub);background:none;border:none;border-radius:9px;cursor:pointer;}
  .tab-btn.active{background:var(--ink);color:#fff;}
  .page{display:none;}
  .page.active{display:block;}
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .stat-card{border-radius:12px;padding:14px;}
  .stat-card.income{background:var(--success-bg);cursor:pointer;}
  .stat-card.expense{background:var(--danger-bg);}
  .stat-label{font-size:11.5px;font-weight:600;margin-bottom:4px;}
  .stat-card.income .stat-label{color:var(--success);}
  .stat-card.expense .stat-label{color:var(--danger);}
  .stat-val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
  .stat-card.income .stat-val{color:var(--success);}
  .stat-card.expense .stat-val{color:var(--danger);}
  .stat-hint{font-size:10px;color:var(--success);margin-top:2px;opacity:0.75;}
  .net-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;}
  .net-card span:first-child{font-size:13px;color:var(--sub);}
  .net-card span:last-child{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;}
  .section-title{font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .add-btn{background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;padding:7px 12px;cursor:pointer;}
  .cat-row{padding:10px 0;border-bottom:1px solid var(--border);}
  .cat-row:last-child{border-bottom:none;}
  .cat-head{display:flex;align-items:center;gap:12px;}
  .cat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .cat-name{font-size:14px;font-weight:600;}
  .cat-sub{font-size:11.5px;color:var(--sub);margin-top:1px;}
  .cat-amt{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;margin-left:auto;}
  .entry-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0 6px 48px;font-size:12.5px;color:var(--sub);}
  .entry-del{background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;}
  .empty-state{text-align:center;padding:2rem 1rem;color:var(--sub);font-size:13px;}
  .field{margin-bottom:1rem;}
  .field label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px;}
  select, input[type="number"], input[type="text"]{
    width:100%;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);
    background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;outline:none;
  }
  select:focus, input:focus{border-color:var(--ink-soft);}
  .note-box{background:var(--gold-bg);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#8A6414;margin-bottom:1rem;line-height:1.5;}
  .calc-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:1.25rem;}
  .calc-row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px;}
  .calc-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-top:8px;border-top:1px solid var(--border);margin-top:8px;}
  .calc-total span:last-child{color:var(--success);font-family:'IBM Plex Mono',monospace;}
  .save-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;}
  .export-btn{width:100%;background:var(--gold);color:#3D2B03;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:1rem;display:flex;align-items:center;justify-content:center;gap:8px;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(38,52,74,0.5);align-items:center;justify-content:center;z-index:50;padding:1.25rem;}
  .modal-overlay.active{display:flex;}
  .modal-box{background:var(--card);border-radius:14px;padding:1.25rem;max-width:360px;width:100%;}
  .modal-box h3{margin:0 0 1rem;font-size:15px;}
  .rev-total{background:var(--success-bg);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;}
  .rev-total span:first-child{font-size:13px;font-weight:600;color:var(--success);}
  .rev-total span:last-child{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--success);}
  .form-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1.25rem;}
  input[type="date"]{width:100%;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;outline:none;}
  .save-btn.green{background:var(--success);}
  .sync-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:1.25rem;}
  .sync-btn{width:100%;background:#635BFF;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;}
  .sync-btn:disabled{opacity:0.6;cursor:default;}
  .sync-status{font-size:12px;color:var(--sub);margin-top:8px;text-align:center;min-height:1.2em;}
  .sync-link{background:none;border:none;color:var(--sub);font-size:11px;text-decoration:underline;cursor:pointer;display:block;margin:6px auto 0;}
  .file-label{display:block;text-align:center;cursor:pointer;}
  .imp-row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .imp-row.on{border-color:var(--ink-soft);}
  .imp-row.dup{opacity:0.5;}
  .imp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .imp-desc{font-size:13px;font-weight:600;word-break:break-word;}
  .imp-date{font-size:11.5px;color:var(--sub);}
  .imp-amt{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;white-space:nowrap;}
  .imp-amt.neg{color:var(--danger);}
  .imp-amt.pos{color:var(--success);}
  .imp-row select{margin-top:8px;font-size:13px;padding:8px 10px;}
  .imp-pct{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub);}
  .imp-pct input{width:80px;font-size:13px;padding:6px 8px;}
  footer{text-align:center;font-size:11px;color:var(--sub);margin-top:2rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo-img" src="logo.png" alt="Freelance Ledger" width="720" height="211">
    <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
  </header>
  <div class="tabs">
    <button class="tab-btn active" data-page="dash" data-i18n="tab.dash"></button>
    <button class="tab-btn" data-page="rev" data-i18n="tab.rev"></button>
    <button class="tab-btn" data-page="add" data-i18n="tab.add"></button>
    <button class="tab-btn" data-page="imp" data-i18n="tab.imp"></button>
  </div>
  <div class="page active" id="page-dash">
    <div class="stat-row">
      <div class="stat-card income" onclick="switchTab('rev')">
        <div class="stat-label" data-i18n="dash.income"></div>
        <div class="stat-val" id="dash-revenue">0 $</div>
        <div class="stat-hint" data-i18n="dash.hint"></div>
      </div>
      <div class="stat-card expense">
        <div class="stat-label" data-i18n="dash.expense"></div>
        <div class="stat-val" id="dash-total-deductible">0 $</div>
      </div>
    </div>
    <div class="net-card">
      <span data-i18n="dash.net"></span>
      <span id="dash-net">0 $</span>
    </div>
    <div class="section-title">
      <span data-i18n="dash.bycat"></span>
      <button class="add-btn" onclick="goToAdd()" data-i18n="btn.add"></button>
    </div>
    <div id="cat-list"></div>
    <button class="export-btn" onclick="exportForAccountant()" data-i18n="btn.export"></button>
  </div>
  <div class="page" id="page-rev">
    <div class="rev-total"><span data-i18n="rev.total"></span><span id="rev-total">0 $</span></div>
    <div class="sync-card">
      <button class="sync-btn" id="sync-btn" onclick="syncStripe()" data-i18n="sync.btn"></button>
      <div class="sync-status" id="sync-status"></div>
      <button class="sync-link" onclick="resetStripeToken()" data-i18n="sync.change"></button>
    </div>
    <div class="form-card">
      <div class="field">
        <label data-i18n="lbl.source"></label>
        <select id="inc-cat"></select>
      </div>
      <div class="field">
        <label data-i18n="lbl.client"></label>
        <input type="text" id="inc-desc" data-i18n-ph="ph.client">
      </div>
      <div class="field">
        <label data-i18n="lbl.pretax"></label>
        <input type="number" id="inc-amount" placeholder="0.00" step="0.01">
      </div>
      <div class="field">
        <label data-i18n="lbl.tax"></label>
        <input type="number" id="inc-tax" placeholder="0.00" step="0.01">
      </div>
      <div class="field">
        <label data-i18n="lbl.paydate"></label>
        <input type="date" id="inc-date">
      </div>
      <button class="save-btn green" onclick="saveIncome()" data-i18n="btn.saveinc"></button>
    </div>
    <div class="section-title"><span data-i18n="rev.bysource"></span></div>
    <div id="rev-list"></div>
  </div>
  <div class="page" id="page-add">
    <div class="field">
      <label data-i18n="lbl.category"></label>
      <select id="cat-select" onchange="onCatChange()"></select>
    </div>
    <div class="field">
      <label data-i18n="lbl.desc"></label>
      <input type="text" id="desc-input" data-i18n-ph="ph.desc">
    </div>
    <div class="field">
      <label data-i18n="lbl.paid"></label>
      <input type="number" id="amount-input" value="" placeholder="0.00" step="0.01" oninput="updateCalc()">
    </div>
    <div class="field" id="pct-field" style="display:none;">
      <label id="pct-label"></label>
      <input type="number" id="pct-input" value="40" min="0" max="100" oninput="updateCalc()">
    </div>
    <div class="note-box" id="note-box"></div>
    <div class="calc-box">
      <div class="calc-row"><span data-i18n="calc.paid"></span><span id="calc-amount">0,00 $</span></div>
      <div class="calc-row"><span data-i18n="calc.rate"></span><span id="calc-rate">50%</span></div>
      <div class="calc-total"><span data-i18n="calc.final"></span><span id="calc-final">0,00 $</span></div>
    </div>
    <button class="save-btn" onclick="saveExpense()" data-i18n="btn.saveexp"></button>
  </div>
  <div class="page" id="page-imp">
    <div class="note-box" data-i18n-h="imp.note"></div>
    <label class="save-btn file-label"><span data-i18n="imp.choose"></span><input type="file" id="imp-file" accept=".csv,text/csv" hidden></label>
    <div class="sync-status" id="imp-status"></div>
    <div id="imp-list" style="margin-top:1rem;"></div>
    <button class="save-btn green" id="imp-confirm" style="display:none;" onclick="confirmImport()"></button>
  </div>
  <footer data-i18n-h="footer"></footer>
</div>

var STRIPE_WORKER = 'https://damp-math-1fc9bilanclair-stripe.smartgrocer.workers.dev';
var TOKEN_KEY = 'bilanclair_stripe_token';
function getStripeToken(){
  try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; }
}
function resetStripeToken(){
  try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  setStatus('sync-status', [['sync.cleared']]);
}
async function syncStripe(){
  var btn = document.getElementById('sync-btn');
  var token = getStripeToken();
  if(!token){
    token = (prompt(t('sync.prompt')) || '').trim();
    if(!token) return;
  }
  btn.disabled = true;
  setStatus('sync-status', [['sync.running']]);
  try{
    var res = await fetch(STRIPE_WORKER + '/', { headers: { Authorization: 'Bearer ' + token } });
    if(res.status === 401){
      try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
      var d = {};
      try{ d = (await res.json()).detail || {}; }catch(e){}
      if(d.secretConfigure === false){
        setStatus('sync-status', [['sync.nosecret']]);
      } else if(d.longueurAttendue !== undefined){
        setStatus('sync-status', [['sync.len', { exp: d.longueurAttendue, got: d.longueurRecue }]]);
      } else {
        setStatus('sync-status', [['sync.denied']]);
      }
      return;
    }
    var data = await res.json();
    if(!res.ok){ setStatus('sync-status', [['sync.err', { e: data.error || res.status }]]); return; }
    try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}

    var known = {};
    incomes.forEach(function(i){ if(i.sid) known[i.sid] = true; });
    expenses.forEach(function(e){ if(e.sid) known[e.sid] = true; });

    var n = 0, nInc = 0, nFee = 0, skippedCur = 0;
    data.transactions.forEach(function(tx){
      if(tx.devise !== 'cad'){ skippedCur++; return; }
      var date = tx.date;
      var label = tx.description || 'Stripe';
      var isIncome = (tx.type === 'charge' || tx.type === 'payment');
      var isRefund = (tx.type === 'refund' || tx.type === 'payment_refund');
      if((isIncome || isRefund) && !known[tx.id]){
        incomes.push({ id: Date.now() + (n++), cat: 'contrat', amount: tx.montant, tax: 0,
          desc: (isRefund ? t('stripe.refund') : t('stripe.pay')) + label, date: date, sid: tx.id });
        nInc++;
      }
      if((isIncome || isRefund) && tx.frais !== 0 && !known[tx.id + ':fee']){
        expenses.push({ id: Date.now() + (n++), cat: 'bancaire', amount: tx.frais, pct: 100,
          desc: t('stripe.fee') + label, date: date, sid: tx.id + ':fee' });
        nFee++;
      }
      if(tx.type === 'stripe_fee' && !known[tx.id]){
        expenses.push({ id: Date.now() + (n++), cat: 'bancaire', amount: -tx.montant, pct: 100,
          desc: t('stripe.fee') + label, date: date, sid: tx.id });
        nFee++;
      }
    });
    saveData();
    renderDashboard();
    var parts = (nInc === 0 && nFee === 0) ? [['sync.uptodate']] : [['sync.added', { n: nInc, f: nFee }]];
    if(skippedCur) parts.push(['sync.skipped', { n: skippedCur }]);
    setStatus('sync-status', parts);
  }catch(e){
    setStatus('sync-status', [['sync.unreachable']]);
  }finally{
    btn.disabled = false;
  }
}

var importRows = [];
var IMPORT_HINTS = [
  { re: /\b(bell|vid[ée]otron|fido|koodo|telus|rogers|virgin|fizz|public mobile)\b/i, cat: 'telecom' },
  { re: /(anthropic|claude\.ai|openai|cloudflare|github|namecheap|godaddy|google \*?workspace)/i, cat: 'fournitures' }
];
function pad2(n){ return String(n).padStart(2, '0'); }
function stripAccents(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  var first = text.split(/\r?\n/)[0] || '';
  var delim = first.split(';').length > first.split(',').length ? ';' : ',';
  var rows = [], row = [], cell = '', inQ = false;
  function endRow(){
    row.push(cell); cell = '';
    if(row.some(function(x){ return x.trim() !== ''; })) rows.push(row);
    row = [];
  }
  for(var i = 0; i < text.length; i++){
    var c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if(c === '"'){ inQ = true; }
    else if(c === delim){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; endRow(); }
    else cell += c;
  }
  endRow();
  return rows;
}
function parseAmount(s){
  s = String(s || '').replace(/[\s$ ]/g, '');
  if(!s) return NaN;
  var neg = /^\(.*\)$/.test(s) || s.charAt(0) === '-' || s.charAt(0) === '−';
  s = s.replace(/[()\-+−]/g, '');
  if(/,\d{1,2}$/.test(s) && s.indexOf('.') === -1) s = s.replace(',', '.');
  s = s.replace(/,/g, '');
  var n = parseFloat(s);
  if(isNaN(n)) return NaN;
  return neg ? -n : n;
}
function parseDateStr(s, dmy){
  s = String(s || '').trim();
  var y, mo, d, m = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec(s);
  if(m){ y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
    if(!m) return null;
    var a = +m[1], b = +m[2]; y = +m[3];
    if(y < 100) y += 2000;
    if(dmy){ d = a; mo = b; } else { mo = a; d = b; }
  }
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return y + '-' + pad2(mo) + '-' + pad2(d);
}
function analyzeCSV(text){
  var rows = parseCSV(text);
  if(rows.length < 2) return { err: ['imp.err.empty'] };
  var head = rows[0].map(stripAccents);
  function find(re, skip){
    for(var i = 0; i < head.length; i++){ if(i !== skip && re.test(head[i])) return i; }
    return -1;
  }
  var cDate = find(/date/);
  var cAmt = find(/^(amount|montant)/);
  var cDeb = find(/^(debit|retrait|withdraw)/);
  var cCre = find(/^(credit|depot|deposit)/);
  var cType = find(/^(transaction|type)$/);
  var cName = find(/^(name|nom|payee|beneficiaire)/);
  if(cName < 0) cName = find(/description/);
  var cMemo = find(/^(memo|note|details|description)/, cName);
  if(cDate < 0 || (cAmt < 0 && cDeb < 0 && cCre < 0)){
    return { err: ['imp.err.cols', { cols: rows[0].join(', ') }] };
  }
  var data = rows.slice(1);
  var dmy = data.some(function(r){
    var m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.]\d{2,4}$/.exec((r[cDate] || '').trim());
    return m && parseInt(m[1], 10) > 12;
  });
  var out = [], seen = {};
  data.forEach(function(r){
    var date = parseDateStr(r[cDate], dmy);
    if(!date) return;
    var amt;
    if(cAmt >= 0){ amt = parseAmount(r[cAmt]); }
    else {
      var dv = parseAmount(r[cDeb]), cv = parseAmount(r[cCre]);
      amt = (!isNaN(cv) && cv) ? Math.abs(cv) : ((!isNaN(dv) && dv) ? -Math.abs(dv) : NaN);
    }
    if(cType >= 0 && !isNaN(amt)){
      var ty = stripAccents(r[cType] || '');
      if(/^debit/.test(ty)) amt = -Math.abs(amt);
      else if(/^credit/.test(ty)) amt = Math.abs(amt);
    }
    if(isNaN(amt) || amt === 0) return;
    var name = ((cName >= 0 ? r[cName] : '') || '').trim();
    var memo = ((cMemo >= 0 ? r[cMemo] : '') || '').trim();
    var desc = name || memo || '';
    if(name && memo && memo !== name) desc += ' — ' + memo;
    var key = date + '|' + desc + '|' + amt.toFixed(2);
    seen[key] = (seen[key] || 0) + 1;
    out.push({ date: date, desc: desc, amt: amt, sid: 'csv:' + key + '#' + seen[key], choice: '', pct: 0, dup: false });
  });
  if(out.length === 0) return { err: ['imp.err.none'] };
  out.sort(function(a, b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  return { rows: out };
}
function importHint(r){
  if(r.amt >= 0) return '';
  for(var i = 0; i < IMPORT_HINTS.length; i++){ if(IMPORT_HINTS[i].re.test(r.desc)) return IMPORT_HINTS[i].cat; }
  return '';
}
function applyChoice(r, key){
  r.choice = key;
  r.pct = 0;
  if(key && r.amt < 0 && CATEGORIES[key].hasPct) r.pct = CATEGORIES[key].defaultPct;
}
function importRowHTML(r, idx){
  var isExp = r.amt < 0;
  var cats = isExp ? CATEGORIES : INCOME_CATS;
  var nameFn = isExp ? catName : incName;
  var cls = 'imp-row' + (r.choice ? ' on' : '') + (r.dup ? ' dup' : '');
  var html = '<div class="' + cls + '" id="imp-row-' + idx + '">' +
    '<div class="imp-top"><div><div class="imp-desc">' + esc(r.desc || t('nodesc')) + '</div>' +
    '<div class="imp-date">' + r.date + '</div></div>' +
    '<div class="imp-amt ' + (isExp ? 'neg' : 'pos') + '">' + (isExp ? '−' : '+') + fmt(Math.abs(r.amt)) + '</div></div>';
  if(r.dup){
    html += '<div class="imp-date" style="margin-top:6px;">' + t('imp.dup') + '</div>';
  } else {
    html += '<select onchange="setImportChoice(' + idx + ', this.value)"><option value="">' + t('imp.ignore') + '</option>';
    Object.keys(cats).forEach(function(k){
      html += '<option value="' + k + '"' + (r.choice === k ? ' selected' : '') + '>' + cats[k].icon + ' ' + nameFn(k) + '</option>';
    });
    html += '</select>';
    if(r.choice && isExp && CATEGORIES[r.choice].hasPct){
      html += '<div class="imp-pct"><span>' + t('pct.default') + '</span><input type="number" min="0" max="100" value="' + r.pct + '" oninput="setImportPct(' + idx + ', this.value)"></div>';
    }
  }
  return html + '</div>';
}
function updateImportButton(){
  var n = importRows.filter(function(r){ return r.choice && !r.dup; }).length;
  var btn = document.getElementById('imp-confirm');
  btn.style.display = n > 0 ? 'block' : 'none';
  btn.textContent = t(n > 1 ? 'imp.btnN' : 'imp.btn1', { n: n });
}
function renderImportList(){
  document.getElementById('imp-list').innerHTML = importRows.map(importRowHTML).join('');
  updateImportButton();
}
function setImportChoice(idx, key){
  applyChoice(importRows[idx], key);
  document.getElementById('imp-row-' + idx).outerHTML = importRowHTML(importRows[idx], idx);
  updateImportButton();
}
function setImportPct(idx, val){
  var p = parseFloat(val);
  importRows[idx].pct = isNaN(p) ? 0 : Math.max(0, Math.min(100, p));
}
function handleImportText(text){
  var res = analyzeCSV(text);
  importRows = [];
  if(res.err){ setStatus('imp-status', [res.err]); renderImportList(); return; }
  var known = {};
  incomes.forEach(function(i){ if(i.sid) known[i.sid] = true; });
  expenses.forEach(function(e){ if(e.sid) known[e.sid] = true; });
  var nDup = 0;
  res.rows.forEach(function(r){
    if(known[r.sid]){ r.dup = true; nDup++; }
    else { var h = importHint(r); if(h) applyChoice(r, h); }
  });
  importRows = res.rows;
  renderImportList();
  setStatus('imp-status', [nDup ? ['imp.readdup', { n: importRows.length, d: nDup }] : ['imp.read', { n: importRows.length }]]);
}
function confirmImport(){
  var nExp = 0, nInc = 0, k = 0;
  importRows.forEach(function(r){
    if(!r.choice || r.dup) return;
    var iso = new Date(r.date + 'T12:00:00').toISOString();
    if(r.amt < 0){
      var cat = CATEGORIES[r.choice];
      expenses.push({ id: Date.now() + (k++), cat: r.choice, amount: -r.amt, pct: cat.hasPct ? r.pct : cat.fixedRate, desc: r.desc, date: iso, sid: r.sid });
      nExp++;
    } else {
      incomes.push({ id: Date.now() + (k++), cat: r.choice, amount: r.amt, tax: 0, desc: r.desc, date: iso, sid: r.sid });
      nInc++;
    }
  });
  saveData();
  renderDashboard();
  importRows = [];
  renderImportList();
  setStatus('imp-status', [['imp.done', { e: nExp, i: nInc }]]);
}
document.getElementById('imp-file').addEventListener('change', function(ev){
  var f = ev.target.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    if(String(reader.result).indexOf('�') !== -1){
      var r2 = new FileReader();
      r2.onload = function(){ handleImportText(r2.result); };
      r2.readAsText(f, 'windows-1252');
    } else { handleImportText(reader.result); }
  };
  reader.readAsText(f, 'UTF-8');
  ev.target.value = '';
});

/* ---------- Navigation et langue ---------- */
function switchTab(page){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.page === page); });
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
}
function goToAdd(){ switchTab('add'); }
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){ switchTab(btn.dataset.page); });
});
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-h]').forEach(function(el){ el.innerHTML = t(el.getAttribute('data-i18n-h')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  var btn = document.getElementById('lang-btn');
  btn.textContent = lang === 'fr' ? 'EN' : 'FR';
  btn.title = lang === 'fr' ? 'English' : 'Français';
  fillSelect('cat-select', CATEGORIES, catName);
  fillSelect('inc-cat', INCOME_CATS, incName);
  renderDashboard();
  updateCalc();
  renderImportList();
  renderStatus('sync-status');
  renderStatus('imp-status');
}
function toggleLang(){
  lang = lang === 'fr' ? 'en' : 'fr';
  try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
  applyLang();
}
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
lang = detectLang();
document.getElementById('inc-date').value = todayStr();
loadData();
applyLang();
</script>
